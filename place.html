<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ireland country page by Paul Silas with facts and weather for Dublin.">
    <meta name="author" content="Paul Silas">
    <title>Ireland – Paul Silas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Ireland</h1>
    </header>
    <main>
        <picture class="hero">
            <source media="(min-width: 50rem)" srcset="images/dublin-large.webp">
            <img src="images/dublin-small.webp" alt="Ha'penny Bridge over the River Liffey in Dublin" width="500" height="750">
        </picture>
        <section class="data">
            <h2>Data</h2>
            <dl>
                <dt>Area:</dt>
                <dd>70,273 sq km</dd>
                <dt>Population:</dt>
                <dd>5,149,139</dd>
                <dt>Capital:</dt>
                <dd>Dublin</dd>
                <dt>Languages:</dt>
                <dd>Irish, English</dd>
                <dt>Currency:</dt>
                <dd>Euro</dd>
                <dt>Time Zone:</dt>
                <dd>UTC+0</dd>
                <dt>Calling Code:</dt>
                <dd>+353</dd>
                <dt>Internet TLD:</dt>
                <dd>.ie</dd>
            </dl>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <img class="weather-icon" src="images/weather.svg" alt="Partly cloudy weather icon" width="64" height="64">
            <dl>
                <dt>Temperature:</dt>
                <dd>8 &deg;C</dd>
                <dt>Conditions:</dt>
                <dd>Partly Cloudy</dd>
                <dt>Wind:</dt>
                <dd>10 km/h</dd>
                <dt>Wind Chill:</dt>
                <dd id="windchill"></dd>
            </dl>
        </section>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Paul Silas | Ireland</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
